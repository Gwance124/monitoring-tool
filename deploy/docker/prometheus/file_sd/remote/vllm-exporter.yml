# Placeholder target -- not generated by generate-file-sd.py, unlike the
# other exporters in this directory: vLLM hosts are not part of the Docker
# Compose exporter inventory (inventory/exporters.yaml), so edit the
# host:port below by hand before starting Prometheus.
#
# The `server` label is required, not cosmetic: every query the extraction
# tooling (benchmark/react_agent/extract_run.py) issues is pinned to
# `{server="<target>"}`, and Prometheus only attaches this label via
# file_sd -- vLLM's native /metrics endpoint never emits it itself. The value
# here must match whatever you pass to `--target`.
- targets:
    - 192.168.3.73:8000
  labels:
    server: solab-x3
