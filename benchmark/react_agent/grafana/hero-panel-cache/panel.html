<div class="benchmark-slide">
  <img
    class="top-left-logo"
    src="/public/img/custom/SK_Hynix.svg.webp"
    alt="SK hynix"
  />

  <div class="corner-decoration" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>

  <header class="slide-header">
    <h1>
      <span class="title-accent">ReAct</span>
      <span class="title-main">(Reasoning & Acting) AI Agent Serving</span>
    </h1>
    <div class="title-rule"></div>
  </header>

  <main class="dashboard-layout">
    <div class="bottom-left-image">
      <img
        src="/public/img/custom/server.png?v=3"
        alt="System architecture"
      />
    </div>
    <section class="summary-column">
      <div class="summary-block">
        <div class="summary-label">Cache hit ratio<br />advantage</div>
        <div class="summary-value">
          <span id="cache-improvement">--</span><span class="percent-symbol">%</span>
        </div>
        <div id="cache-improvement-detail" class="summary-detail">
          MARS compared with second-best system
        </div>
      </div>
    </section>

    <section class="metric-column">
      <h2>Current Cache Hit Ratio</h2>
      <div class="metric-subtitle">Higher is better</div>

      <div id="cache-bars" class="lcd-bar-group"></div>
    </section>

    <!--
      Only one metric-column/chart-section pair for now, so both fill the
      whole row. Adding a second pair (same classes, same order as slide
      one's TTFT/e2e split) auto-squishes both to half-width -- see the
      panel.css comment above .metric-column, .chart-section.
    -->
    <section class="chart-section">
      <h2>External Prefix Cache Hit Ratio</h2>
      <div class="chart-shell">
        <svg
          id="cache-chart"
          class="live-chart"
          preserveAspectRatio="xMidYMid meet"
          role="img"
          aria-label="Cache hit ratio by serving system"
        ></svg>
      </div>
      <div id="cache-legend" class="chart-legend"></div>
    </section>
  </main>

  <footer class="slide-footer">
    <span id="last-updated">Awaiting data</span>
  </footer>
</div>
